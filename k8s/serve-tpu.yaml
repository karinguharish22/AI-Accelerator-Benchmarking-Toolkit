apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-tpu
  namespace: accelbench
  labels: { app: accelbench, workload: serve, accelerator: tpu }
spec:
  replicas: 1
  selector:
    matchLabels: { app: accelbench, workload: serve, accelerator: tpu }
  template:
    metadata:
      labels: { app: accelbench, workload: serve, accelerator: tpu }
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: accelbench-runner
      # Single TPU v5e chip (ct5lp-hightpu-1t), the closest match to one L4.
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 1x1
      tolerations:
        - { key: google.com/tpu, operator: Exists, effect: NoSchedule }
        - { key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule }
      containers:
        - name: vllm
          image: ${VLLM_TPU_IMAGE}
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model=${SERVE_MODEL}
            - --served-model-name=${SERVED_NAME}
            - --max-model-len=${MAX_MODEL_LEN}
            - --tensor-parallel-size=1
            - --download-dir=/cache
            - --port=8000
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token } }
          ports:
            - { name: http, containerPort: 8000 }
          startupProbe: # model download + XLA precompilation of all batch shapes
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 270
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: "16", memory: 32Gi }
            limits: { google.com/tpu: 1 }
          volumeMounts:
            - { name: results, mountPath: /results, readOnly: true }
            - { name: cache, mountPath: /cache }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: results
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes: { bucketName: ${BUCKET}, mountOptions: implicit-dirs }
        - name: cache
          emptyDir: {}
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-tpu
  namespace: accelbench
  labels: { app: accelbench, workload: serve }
spec:
  selector: { app: accelbench, workload: serve, accelerator: tpu }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
